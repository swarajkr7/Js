<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>App</title>
    </head>
    <body>
        <script>
            let i=0;
            let t=1000
            setInterval(()=>{
                i++;
                if(i%2===0){
                    document.title=`(2)new messages`;
                }else{
                    document.title=`App`;
                }
                
            },t);
            
        </script>
    </body>
</html>
