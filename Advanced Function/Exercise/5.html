<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Anonymous Function</title>
    </head>
    <body>
        <button class="start">Add to Cart</button>
        <p class="message"></p>
        <script>
            document.querySelector('.start').addEventListener('click',()=>{
                change();
            })
            const change=()=>{
               document.querySelector('.message').innerText="Added to cart"
               setTimeout(function(){
                document.querySelector('.message').innerText="";
               },2000);
            }
            
        </script>
    </body>
</html>
