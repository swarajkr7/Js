<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Anonymous Function</title>
    </head>
    <body>
        <button class="start" onclick="change()">Add to Cart</button>
        <p class="message"></p>
        <script>
            function change(){
               document.querySelector('.message').innerText="Added to cart"
               setTimeout(function(){
                document.querySelector('.message').innerText="";
               },2000);
            }
            
        </script>
    </body>
</html>
