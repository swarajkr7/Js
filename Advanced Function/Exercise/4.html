<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Anonymous Function</title>
    </head>
    <body>
        <button class="start">Start</button>
        <script>
            document.querySelector('.start').addEventListener('click',()=>{
                change();
            })
            const change=()=>{
                document.querySelector('.start').innerText="Loading...";
                setTimeout(function(){ 
                    document.querySelector('.start').innerText="Finished";
                },1000); 
            }
            
        </script>
    </body>
</html>
