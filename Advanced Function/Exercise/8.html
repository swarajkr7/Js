<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>App</title>
    </head>
    <body>
        <button class="button1" >Add</button>
        <button class="button-1" >Remove</button>
        <script>
            document.querySelector('.button1').addEventListener('click',()=>{
                inDec(1);
            })
            document.querySelector('.button-1').addEventListener('click',()=>{
                inDec(-1);
            })
            const inDec=(num)=>{message+=num};
            let message=2;
            let i=2;
            setInterval(()=>{
                i++;
                if(i%2===0){
                    document.title=`App`;
                }else{
                    document.title=`(${message})new messages`;
                }
            },1000);

        </script>
    </body>
</html>
