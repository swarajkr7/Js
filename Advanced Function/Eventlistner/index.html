<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Rock Paper using Local Storage</title>
        <link rel="stylesheet" href="/Advanced Function/Eventlistner/style.css">
    </head>
    <body>
          <p class="title">Rock Paper Scissor</p>
        <button class="move-button js-rock-button"><img src="/Images/rock-emoji.png" class="move-icon"></button>
        <button class="move-button js-paper-button" ><img src="/Images/paper-emoji.png" class="move-icon" ></button>
        <button class="move-button js-scissors-button" ><img src="/Images/scissors-emoji.png" class="move-icon" ></button>
        <p class="result js-result"></p>
        <p class="move"></p>
        <p class="score js-score">Wins:0 Losses:0 Ties:0</p>
        <button class="reset-button"onclick="reset()">Reset Score</button>
        <button class="auto-play-button" onclick="autoPlay()">Auto Play</button>
        <script src="/Advanced Function/Eventlistner/script.js"></script>
    </body>
</html>
