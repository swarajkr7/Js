<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Arrow Function</title>
    </head>
    <body>
        <script>
            const arrowFunction=()=>{
                console.log("Isko arrow function bolte hai");
            }

            arrowFunction();

            const callbackFunction =(fun)=>{
                fun();
            }

            callbackFunction(()=>{
                console.log("isko call back function bolte hai")
            })

            
        </script>
    </body>
</html>
