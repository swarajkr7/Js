<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Uber Button</title>
        <style>
            .first-button{
                background-color:black;
                color:white;
                border:none;
                font-size: 15px;
                padding:10px 15px;
                font-weight: bold;
                border-radius: 5px;
            }
            .second-button{
                background-color: rgb(230,230,230);
                color:black;
                border:none;
                font-size: 15px;
                padding:10px 15px;
                font-weight: bold;
                border-radius: 5px;
                margin-left:20px;



            }
        </style>
    </head>
    <body>
        <button class="first-button">Request Now</button>
        <button class="second-button">Schedule for later</button>
    </body>
</html>
