<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Rock Paper Scissor</title>
        <style>
            body {
                background-color: rgb(25, 25, 25);
                color:white;
                font-family: Arial;
            }

            .title {
                font-size: 30px;
                font-weight: bold;
            }

            .move-icon {
                height:50px; 
            }
            .move-button{
                background-color: transparent;
                border: 3px solid white;
                width: 120px;
                height: 120px;
                border-radius: 60px;
                margin-right: 10px;
                cursor: pointer;
            }
            .js-result{
                font-size: 25px;
                font-weight: bold;
                margin-top: 50px;
            }
            .js-score{
                margin-top: 50px;
            }
            .reset-button{
                background-color:white;
                border:none;
                font-size:15px;
                padding:8px 15px;
                cursor: pointer;
            }
        </style>
        
    </head>
    <body>
        <p class="title">Rock Paper Scissor</p>
        <button class="move-button" onclick="playGame('rock')"><img src="/Images/rock-emoji.png" class="move-icon"></button>
        <button class="move-button" onclick="playGame('paper')"><img src="/Images/paper-emoji.png" class="move-icon" ></button>
        <button class="move-button" onclick="playGame('scissors')"><img src="/Images/scissors-emoji.png" class="move-icon" ></button>
        <p class="result js-result"></p>
        <p class="move"></p>
        <p class="score js-score">Wins:0 Losses:0 Ties:0</p>
        <button class="reset-button"onclick="reset()">Reset Score</button>

        <script>
             const score={
                Wins:0,
                Losses:0,
                Ties:0   
            }

            function reset(){
                score.Wins=0;
                score.Losses=0;
                score.Ties=0;
                displayResult();
                console.log(score)
            }

            function playGame(playerMove){

                let result=" ";

                const computerMove = randomNumber();

                if (computerMove===playerMove){
                    score.Ties+=1;
                    displayResult(result="Tie",playerMove,computerMove);
                    

                }else{
                    if(computerMove==="rock"){
                        if(computerMove==="rock" && playerMove==="paper"){
                            score.Wins+=1;
                        displayResult(result="Win",playerMove,computerMove);
                        

                        }else{
                             score.Losses+=1;
                            displayResult(result="Loss",playerMove,computerMove);
                           
                        }  
                    }
                    
                    
                    if(computerMove==="paper"){
                        if(computerMove==="paper" && playerMove==="scissors"){
                            score.Wins+=1;
                        displayResult(result="Win",playerMove,computerMove);
                        

                        }else{
                            score.Losses+=1;
                        displayResult(result="Loss",playerMove,computerMove);

                        }
                    }
                    
                    if(computerMove==="scissors"){
                        if(computerMove==="scissors" && playerMove==="rock"){
                            score.Wins+=1;
                        displayResult(result="Win",playerMove,computerMove);
                        

                        }else{
                            score.Losses+=1;
                        displayResult(result="Loss",playerMove,computerMove);
                        
                        }
                    }
                    
                }
            }

                function displayResult(result="",playerMove="",computerMove=""){

                    document.querySelector('.result').innerText=`You ${result}!`;
                    document.querySelector('.move').innerHTML=
                    `You
                    <img  class="move-icon" src="/Images/${playerMove}-emoji.png">
                    <img class="move-icon" src="/Images/${computerMove}-emoji.png">
                     Computer`;
                    document.querySelector('.score').innerText=`Wins:${score.Wins}, Losses:${score.Losses}, Ties:${score.Ties}`;

//                     console.log(`Your picked: ${playerMove}. Computer picked: ${computerMove} Result: ${result}
// Wins:${score.Wins}, Loss:${score.Losses}, Tie:${score.Ties}`);

                }
        

                function randomNumber(){
                    const choice=Math.random();

                    let computerMove='';

                    if(choice>=0 && choice <1/3){
                        computerMove='rock';

                    }else if(choice>=1/3 && choice <2/3){
                        computerMove='paper';

                    }else{
                        computerMove='scissors'; 

                    }

                    return computerMove;
                }

        </script>
    </body>
</html>
