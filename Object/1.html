<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Object</title>
        <script>
            const student={
                name: 'swaraj',
                roll: '21',
                class: '12',
                fun: function Intro(){
                    return `Function inside the object`

                },
                object: {
                    sub: 'science',
                    score: '98'
                }
            }
            console.log(student.name)
            console.log(student.lastname="kumar")
            delete(student.lastname);
            console.log(student.fun())
            console.log(student.object.sub)
            console.log(student['name'])//we can also use this way to getting the values from the objects

        </script>
    </head>
    <body>
    </body>
</html>
