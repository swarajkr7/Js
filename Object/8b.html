<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Object</title>
    </head>
    <body>
        <script>

            function comparePrice(product1, product2){
                if(product1.price>product2.price){
                    return product2
                }else{
                    return product1
                }

            }

            const product1={
                name:"T-shirt",
                price:"$20.45"
            }
            const product2={
                name:"Jeans",
                price:"$15.78"
            }

            console.log(comparePrice(product1,product2))
        </script>
    </body>
</html>
