<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Destructuring</title>
    </head>
    <body>
        <script>
            //destruturing shortcut
            const array=[10,20,30,40];
            //now suppose if we have to take the first and last value of the strign 
            //then normally we will write code as
            // const firstValue=array[0];
            // const lastValue=array[3];
            // console.log(firstValue);
            // console.log(lastValue);
            //but by using destructuring 

            const [firstValue,secondValue]=array;
            console.log(firstValue);
            console.log(secondValue);

        </script>

    </body>
</html>
