<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>
            Array Methods
        </title>
    </head>
    <body>
        <script>
            /*--------------------Filter Method--------------------*/
            //in filter method it returns a value 
            //and filter method inside function takes two values

            console.log([1,-2,3].filter((value,index)=>{
                    return true;
            }));

            console.log([1,-2,3].filter((value,index)=>{
                return false;
            }))

            //filter method will return an array and it will iterate over all the value of the array
            // if it true then then it will add it to array and if false it wont.


            /*--------------------Map method-------------------*/
            //map will transform an array into another array based on the return value

            console.log([1,1,3].map((value,index)=>{
                return value*2;
            }));
            

            //if we have only one parameter inside the map function then we have shortcut for it 
            //we can ignore the parenthesis as well as return .

            console.log([1,1,3].map(value => value*2 ));//this code will also give same value as above


            console.log(['cat','dog', 'dear', 'buffalow'].map((value)=>{
                return value;
            }));

            //Map method return a string so if using it inside the fucntion get the returned
            //values inside a function or you can directly return the array.map()

            
        </script>

    </body>
</html>
