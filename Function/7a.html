<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Function</title>
        <script>
            function greet(name){
                if (!name){
                    console.log(`Hi there!`)
                }else{
                    console.log(`Hello ${name}!`)
                }
                
            }

            function convertToFahrenheit(celcius){
                const fahrenheit=(celcius*9/5) + 32;
                return fahrenheit;

            }

            function convertToCelcius(fahrenheit){
                const celcius=(fahrenheit-32)*5/9;
                return celcius;

            }


            function convertTemperature(degrees, unit){
                if(unit==='C'){
                    return (`${convertToFahrenheit(degrees)}F`)
                }else{
                    return (`${convertToCelcius(degrees)}C`)
                } 

            }

            function convertLength(length, from, to){
                if(from==='miles'){
                    if(to==='feet'){
                        return length*5280 + ` ${to}`
                    }else{
                        return length*1.6 + ` ${to}`
                    }
                }else if(from==='km'){
                    if(to==='feet'){
                        return length*3281 + ` ${to}`
                    }else{
                        return length*5/8 + ` ${to}`
                    }
                    
                }else{
                    return `Invalid unit:${to}`
                }

            }

            greet();
            greet('simon');
            greet('chris');
            greet('joy');

            console.log(convertToFahrenheit(25));
            console.log(convertToCelcius(86));
            console.log(convertTemperature(25,'C'));
            console.log(convertLength(5,'lbs','lbs'))
        </script>
    </head>
    <body>

    </body>
</html>
