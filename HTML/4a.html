<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Buttons</title>
        <style>
            .yellow {
                background-color: yellow;
            }
            .Orange {
                background-color: orange;
            }
        </style>
        <script>
            console.log("Welcome");
            function addToCart() {
                alert("Added");
            }
            function buyNow() {
                console.log("Loading");
                alert("Purchased");
            }
        </script>
    </head>
    <body>
        <div>
            <h1>Adult Plain Cotton T-shirt</h1>
            <h2>Price: $7.99</h2>
        </div>
        </button>
        <button class="yellow" onclick="addToCart()">Add To Cart</button>
        <button class="Orange" onclick="buyNow()">Buy Now</button>
    </body>

</html>
