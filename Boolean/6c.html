<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Boolean</title>
        <script>
            const age=65;
            const isHoliday=true;
            if ((isHoliday) && (age<=6 || age>=65)){
                console.log(`No Discount!`);
            }else if((!isHoliday) && (age<=6 || age>=65)){
                console.log(`Discount!`)
            }else{
                console.log(`No Discount`);
            }
        </script>
    </head>
    <body>

    </body>
</html>
