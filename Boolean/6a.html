<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Boolean</title>
        <script>
            const now=new Date();
            const currentHour=now.getHours();
            if (currentHour>=6 && currentHour <=12){
                console.log("Good Morning!");
            }else if(currentHour>=13 && currentHour <=17){
                console.log("Good Afternoon!");
            }else{
                console.log("Good Night!")
            }
        </script>
    </head>

</html>
