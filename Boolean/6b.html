<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Boolean</title>
        <script>
            const name="Swaraj"
            const now=new Date();
            const currentHour=now.getHours();
            if (currentHour>=6 && currentHour <=12){
                console.log(`Good Morning ${name}!`);
            }else if(currentHour>=13 && currentHour <=17){
                console.log(`Good Afternoon ${name}!`);
            }else{
                console.log(`Good Night ${name}!`)
            }
        </script>
    </head>
    <body>
        
    </body>
</html>
