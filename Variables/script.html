<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>variables</title>
        <script>
            let name="Swaraj Kumar"
            console.log(`My name is ${name}`);
            let coffe =1;
            let bagels =6;
            let soup=9;
            console.log(`The total cost of dinnig: $${coffe+bagels+soup}`);
            console.log(`Tax: $${(coffe+bagels+soup)*0.1}`);
            let cost=coffe+bagels+soup;
            let tax=cost*0.1;
            console.log(`Total: $${cost+tax}`)
        </script>
    </head>

    </body>
</html>
