<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title></title>
    </head>
    <body>
        <script>

                const num=4;
                let count=1;
                let isPrime=false;

                function checkPrime(num){
                    for(let i=2; i<=num; i++){
                        if(num%i===0){
                            count++;
                        }
                    if(count>2){
                        isPrime=false;
                    }else{
                        isPrime=true;
                    }
                 }
                 return isPrime;
                }
                
                console.log(checkPrime(num));

        </script>
    </body>
</html>
