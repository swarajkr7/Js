<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Rock Paper using Local Storage</title>
        <script>
            //  const score={
            //     Wins:0,
            //     Losses:0,
            //     Ties:0   
            // }
 
            const score=JSON.parse(localStorage.getItem('score')) || {  //this is called default operator
                    Wins:0,                                             // in this if left side is true then it will
                    Losses:0,                               // left side will work and if right side is true then 
                    Ties:0                              //then right side will work 
                };

            // if (score===null){
            //     score = {
            //         Wins:0,
            //         Losses:0,
            //         Ties:0
            //     };
            // }

            function reset(){
                score.Wins=0;
                score.Losses=0;
                score.Ties=0;
                localStorage.removeItem('score');
            }

            function playGame(playerMove){

                let result=" ";

                const computerMove = randomNumber();

                if (computerMove===playerMove){
                    score.Ties+=1;
                    displayResult(result="Tie",playerMove,computerMove);
                    

                }else{
                    if(computerMove==="rock"){
                        if(computerMove==="rock" && playerMove==="paper"){
                            score.Wins+=1;
                        displayResult(result="Win",playerMove,computerMove);
                        

                        }else{
                             score.Losses+=1;
                            displayResult(result="Loss",playerMove,computerMove);
                           
                        }  
                    }
                    
                    
                    if(computerMove==="paper"){
                        if(computerMove==="paper" && playerMove==="scissor"){
                            score.Wins+=1;
                        displayResult(result="Win",playerMove,computerMove);
                        

                        }else{
                            score.Losses+=1;
                        displayResult(result="Loss",playerMove,computerMove);
                        

                        }
                    }
                    
                    if(computerMove==="scissor"){
                        if(computerMove==="scissor" && playerMove==="rock"){
                            score.Wins+=1;
                        displayResult(result="Win",playerMove,computerMove);
                        


                        }else{
                            score.Losses+=1;
                        displayResult(result="Loss",playerMove,computerMove);
                        

                        }
                    }
                    
                }
                localStorage.setItem('score',JSON.stringify(score))
            }

                function displayResult(result,playerMove,computerMove){
                    alert(`Your picked: ${playerMove}. Computer picked: ${computerMove} Result: ${result}
Wins:${score.Wins}, Loss:${score.Losses}, Tie:${score.Ties}`)

                }
        

                function randomNumber(){
                    const choice=Math.random();

                    let computerMove='';

                    if(choice>=0 && choice <1/3){
                        computerMove='rock';

                    }else if(choice>=1/3 && choice <2/3){
                        computerMove='paper';

                    }else{
                        computerMove='scissor'; 

                    }

                    return computerMove;
                }

            
        </script>
    </head>
    <body>
        <button onclick="playGame('rock')">Rock</button>
        <button onclick="playGame('paper')">Paper</button>
        <button onclick="playGame('scissor')">Scissor</button>
        <button onclick="reset()">Reset Score</button>
    </body>
</html>
