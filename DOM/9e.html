<!DOCTYPE html>
<html lang="en-US">
    <headd>
        <title>DOM</title>
    </headd>
    <body>
        <input class="text"  onkeydown=handleKeydown(event) placeholder="Enter your name">
        <button onclick="display()">Submit</button>
        <p class="display"></p>

        <script>
            function handleKeydown(event){
                
                if(event.key==='Enter'){
                    display()
                }

            }
            function display(){
                let text=document.querySelector('.text').value;
                document.querySelector('.display').innerText=`Your name is: ${text}`;

            }
            
        </script>
    </body>
</html>
