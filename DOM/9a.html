<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>DOM</title>
    </head>
    <body>
        <button>Good</button>
        <button class="js-button">Button</button>
        <button class="js">Button</button>
        <p></p>
        <script>
            // document.body.innerHTML="Good Morning!";
            document.title="DOM Manipulation";
            document.querySelector("button").innerText="Sign in";
            document.querySelector(".js-button").innerHTML="Login"
            document.querySelector('.js').innerHTML="Sign Up"
            document.querySelector('p').innerText="This line is added by swaraj kumar";
            document.querySelector('p').style.color="blue";
            // '.' is called class selector and '#' is called id selector
            
        </script>

    </body>
</html>
